name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # webview_go's vendored cgo directive hardcodes the `webkit2gtk-4.0`
      # pkg-config name. That package was dropped entirely in Ubuntu 24.04
      # ("ubuntu-latest"); Ubuntu 22.04 still ships it by this exact name,
      # matching webview_go's own tested CI matrix.
      - name: Install Linux GUI toolkit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v
